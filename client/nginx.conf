# 前端静态资源 + 反向代理到 NestJS
# 约定：前端构建时 base = '/api/'，所以物产里引用 /api/assets/xxx.js、/api/favicon.svg
# 挂载方式：
#   -v <dist目录>:/usr/share/nginx/html:ro
#   -v <本文件>:/etc/nginx/conf.d/default.conf:ro
#
# server 是 Docker 网络里的主机名（不是路径），要求 Nest 容器在同一自定义网络且名字/别名为 server。
# 如果 Nest 跑在宿主机上，把两处 http://server:3000 改成 http://host.docker.internal:3000，
# 并在 docker run 时加 --add-host=host.docker.internal:host-gateway。

# WebSocket 升级头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 100m;

    # ---------- 静态资源（统一在 /api 前缀下） ----------
    # 产物引用 /api/assets/index-xxx.js → 实际文件 /usr/share/nginx/html/assets/index-xxx.js
    location ^~ /api/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /api/favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
        expires 7d;
    }

    # ---------- 接口：/api/chat → http://server:3000/chat ----------
    # proxy_pass 末尾的 / 会把 location 前缀 /api/ 去掉
    location /api/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /chat 是流式返回，必须关缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # /api/audio-stream 是 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------- 页面：SPA 路由回落到 index.html ----------
    # pcm-worklet.js 这类 public 下的运行时文件也从根路径取
    location / {
        try_files $uri $uri/ /index.html;
    }
}
